version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "pip"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: "cargo"
    directory: "/pycrockford_rs"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: uv
    directory: /
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - uv
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14
