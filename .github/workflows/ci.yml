name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check spelling
        run: make spelling

      - name: Set up Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          expect-cache: any
          toolchain: stable

      - name: Cache Rust lint and test tools
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2
        with:
          # The Rust crate lives in a subdirectory; without this the action's
          # `cargo metadata` probe runs at the repository root, finds no
          # Cargo.toml, and skips restoring the tool cache entirely.
          workspaces: pycrockford_rs
          # Whitaker is not cached here: install-whitaker owns its installer
          # and suite, and a restored `~/.local/share/whitaker` from an older
          # run made the installer's `git pull` abort on untracked files. The
          # key names this cache apart from the older archives, which still
          # hold that checkout and would otherwise stay eligible to restore.
          key: without-whitaker
          cache-directories: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-audit

      - name: Install Rust lint and test tools
        uses: leynos/shared-actions/.github/actions/install-whitaker@5a99aed78ce68dcebd3052b75c31e6f173162b1e
        with:
          cranelift: true

      - name: Install cargo-audit
        env:
          RUSTFLAGS: ""
        run: cargo install --locked cargo-audit

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Audit dependencies
        run: make audit

      # Pull requests run the suite once, under coverage, and ratchet it
      # without talking to CodeScene. Pushes to main run it once, under
      # coverage, in coverage-main.yml, which alone publishes to CodeScene.
      # `make test-workflow-contracts` holds that shape, and this selection
      # must match the publisher's.
      - name: Test and Measure Coverage
        if: github.event_name == 'pull_request'
        # Pin one interpreter in both lanes: generate-coverage builds its own
        # venv with a bare `uv venv`, which takes whatever uv finds first.
        env:
          UV_PYTHON: '3.13'
        uses: leynos/shared-actions/.github/actions/generate-coverage@5a99aed78ce68dcebd3052b75c31e6f173162b1e
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: msgspec-crockford
          cargo-manifest: pycrockford_rs/Cargo.toml
          with-ratchet: 'true'
          publish-artefact: 'false'

      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
