name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 }}

      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check spelling
        run: make spelling

      - name: Set up Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@2f47859bcf82ae8b5bc10b457683fbd589ca2e41
        with:
          expect-cache: any
          toolchain: stable

      - name: Cache Rust lint and test tools
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2
        with:
          # The Rust crate lives in a subdirectory; without this the action's
          # `cargo metadata` probe runs at the repository root, finds no
          # Cargo.toml, and skips restoring the tool cache entirely.
          workspaces: pycrockford_rs
          cache-directories: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/whitaker-installer
            ~/.local/bin/whitaker
            ~/.local/share/whitaker

      - name: Install Rust lint and test tools
        uses: leynos/shared-actions/.github/actions/install-whitaker@2f47859bcf82ae8b5bc10b457683fbd589ca2e41
        with:
          cranelift: true

      - name: Install cargo-audit
        env:
          RUSTFLAGS: ""
        run: cargo install --locked cargo-audit

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@2f47859bcf82ae8b5bc10b457683fbd589ca2e41
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Audit dependencies
        run: make audit

      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@2f47859bcf82ae8b5bc10b457683fbd589ca2e41
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: msgspec-crockford

          cargo-manifest: pycrockford_rs/Cargo.toml

      - name: Install CodeScene Coverage CLI
        if: env.CS_ACCESS_TOKEN != ''
        run: |
          curl -fsSL --output install-cs-coverage-tool.sh \
            https://downloads.codescene.io/enterprise/cli/install-cs-coverage-tool.sh
          if [ -n "${CODESCENE_CLI_SHA256:-}" ]; then
            echo "${CODESCENE_CLI_SHA256}  install-cs-coverage-tool.sh" | sha256sum -c -
          else
            echo "::notice::CODESCENE_CLI_SHA256 is not set; skipping installer checksum verification"
          fi
          bash install-cs-coverage-tool.sh -y

      - name: Upload coverage to CodeScene
        if: env.CS_ACCESS_TOKEN != ''
        run: |
          if [ ! -f coverage.xml ]; then
            echo "coverage.xml not found!"
            exit 1
          fi
          cs-coverage upload \
            --format "cobertura" \
            --metric "line-coverage" \
            coverage.xml
