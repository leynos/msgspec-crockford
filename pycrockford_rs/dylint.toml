# Whitaker (Dylint) configuration for the Rust extension crate.
#
# `macro_aware_cognitive_complexity` gates cognitive complexity. It skips
# branching a macro generated and holds CodeScene's ceiling of 9. It is
# experimental, so the suite loads it only on request. The tracker is
# https://github.com/leynos/whitaker/issues/504.
[whitaker]
experimental = ["macro_aware_cognitive_complexity"]

[macro_aware_cognitive_complexity]
max_complexity = 9
